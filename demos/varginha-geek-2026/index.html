'<section class="section" id="roteiro"><div class="container roadmap"><div class="panel"><p class="eyebrow">SEU DIA EM ÓRBITA</p><h3>Meu roteiro <span style="color:var(--lime)">('+planned.length+')</span></h3>'+(planned.length?planned.map(function(a){return '<div class="schedule-line"><b>'+a.time+'</b><div><strong>'+safe(a.title)+'</strong><span>'+safe(a.zone)+'</span></div><button class="linktext" data-action="toggle-save" data-id="'+a.id+'">Remover</button></div>'}).join(""):'<div class="empty">Seu roteiro está vazio. Escolha uma atividade na programação para começar.</div>')+'</div><div class="panel"><p class="eyebrow">INFORMAÇÕES ESSENCIAIS</p><h3>Prepare a visita.</h3><div class="schedule-line"><b>DATA</b><div><strong>Domingo, 22/11/2026</strong><span>Das 9h às 18h</span></div></div><div class="schedule-line"><b>LOCAL</b><div><strong>Clube de Varginha</strong><span>R. Dep. Ribeiro de Resende, 374 · Varginha, MG</span></div></div><div class="schedule-line"><b>SOCIAL</b><div><strong>Ingresso solidário</strong><span>Consulte as regras e a doação de 1 kg de alimento no ingresso oficial.</span></div></div><a class="btn secondary" style="margin-top:19px" href="https://www.sympla.com.br/evento/x/3532471" target="_blank" rel="noopener">Ver regras e ingressos ↗</a></div></div></section>'+
'<section class="section alt"><div class="container"><p class="eyebrow">ALÉM DO SITE DO EVENTO</p><h2>Uma experiência conectada.</h2><p class="lede">A parte pública é só o começo. Explore como o mesmo sistema poderia apoiar expositores, credenciamento e a organização.</p><div class="grid3" style="margin-top:24px"><a class="card" href="?view=expositor">'+icon("↗")+'<h3>Área do expositor</h3><p>Checklist, informações do espaço e status do estande.</p><span class="linktext">Abrir ambiente →</span></a><a class="card" href="?view=equipe">'+icon("✓")+'<h3>Equipe de entrada</h3><p>Busca de ingressos e check-in de exemplo.</p><span class="linktext">Abrir ambiente →</span></a><a class="card" href="?view=gestao">'+icon("▦")+'<h3>Gestão do evento</h3><p>Acompanhamento do check-in e informações ao público.</p><span class="linktext">Abrir ambiente →</span></a></div></div></section>'}
function pageHead(kicker,title,desc){return '<div class="breadcrumb"><a href="?view=visitante">← Portal visitante</a><span>/</span><span>'+safe(kicker)+'</span></div><div class="interior-head"><div><p class="eyebrow">'+safe(kicker)+'</p><h1>'+title+'</h1><p class="lede">'+desc+'</p></div><span class="pill"><span class="dot"></span> Dados fictícios</span></div>'}
function expoView(){var labels=["Confirmar dados do estande","Organizar produtos para exposição","Revisar horários da montagem","Preparar atendimento ao público"];var done=state.tasks.filter(Boolean).length;return '<div class="container interior">'+pageHead("AMBIENTE 02 / EXPOSITOR","Seu estande, <span style='color:var(--lime)'>sob controle.</span>","Um espaço de apoio para participantes: tarefas essenciais, perfil de exibição e preparação para o dia do evento.")+'<div class="topstats"><div class="stat"><b>'+done+'/4</b><span>Etapas de preparação</span></div><div class="stat"><b>22 NOV</b><span>Data do evento</span></div><div class="stat"><b>'+ (state.standOpen?"Visível":"Oculto")+'</b><span>Perfil no catálogo (simulação)</span></div></div><div class="two"><div class="stack"><section class="panel"><div class="card-top"><h3>Checklist de preparação</h3>'+chip(Math.round(done/4*100)+"% concluído")+'</div><p>Marque etapas concluídas. O progresso é salvo neste navegador.</p><div class="progress" role="progressbar" aria-label="Progresso do checklist" aria-valuemin="0" aria-valuemax="4" aria-valuenow="'+done+'"><div style="width:'+(done/4*100)+'%"></div></div><div style="margin-top:18px">'+labels.map(function(x,i){return '<div class="rowline"><label style="display:flex;align-items:center;gap:12px;cursor:pointer"><input aria-label="'+safe(x)+'" type="checkbox" data-task="'+i+'" '+(state.tasks[i]?"checked":"")+' style="width:20px;height:20px;accent-color:#d2ff6f"><b>'+safe(x)+'</b></label>'+(state.tasks[i]?chip("Feito"):"")+'</div>'}).join("")+'</div></section><section class="panel"><p class="eyebrow">PERFIL EDITÁVEL</p><h3>Apresentação do estande</h3><label class="field" for="standText">Descrição que o público veria no catálogo</label><textarea class="input" id="standText" maxlength="180">'+safe(state.standText)+'</textarea><p class="help">Nome e descrição são exemplos. Nenhuma alteração é enviada para a organização real.</p><div class="controls"><button class="btn small" data-action="save-stand">Salvar descrição</button><button class="btn small secondary" data-action="toggle-stand">'+(state.standOpen?"Ocultar perfil":"Publicar perfil")+'</button></div></section></div><aside class="panel" style="align-self:start"><p class="eyebrow">PRÉVIA DO EXPOSITOR</p>'+icon("✦")+'<h3>Estação Criativa</h3><p>'+safe(state.standText)+'</p><p class="fine">Local: Setor de expositores · Posição ilustrativa</p><div style="margin-top:12px">'+(state.standOpen?chip("Perfil visível"):chip("Perfil oculto","gray"))+'</div><hr style="border:0;border-top:1px solid #344740;margin:24px 0"><h3>O que este ambiente resolve?</h3><p>Menos informações soltas em mensagens e mais clareza para quem vai montar e operar um estande.</p><a class="btn secondary" href="?view=gestao">Ver visão da organização →</a></aside></div></div>'}
function teamView(){var n=attendees.filter(function(a){return state.checked[a.code]}).length;return '<div class="container interior">'+pageHead("AMBIENTE 03 / EQUIPE","Entrada rápida. <span style='color:var(--lime)'>Fluxo leve.</span>","Um check-in demonstrativo com busca por nome ou código. Nenhum ingresso verdadeiro é consultado ou validado.")+'<div class="topstats"><div class="stat"><b>'+attendees.length+'</b><span>Inscrições no exemplo</span></div><div class="stat"><b>'+n+'</b><span>Entradas validadas na demo</span></div><div class="stat"><b>'+(attendees.length-n)+'</b><span>Aguardando no exemplo</span></div></div><div class="two"><section class="panel"><div class="card-top"><h3>Credenciamento</h3>'+chip("Modo simulação")+'</div><p>Encontre um visitante fictício e registre sua entrada.</p><label class="field" for="searchCode">Nome ou código do ingresso</label><input id="searchCode" class="input" placeholder="Experimente VG-1043 ou Lucas" autocomplete="off"><div class="table-scroll"><table class="data-table"><thead><tr><th>Visitante</th><th>Código</th><th>Situação</th><th>Ação</th></tr></thead><tbody id="attendanceRows"></tbody></table></div></section><aside class="stack"><section class="panel"><p class="eyebrow">INSTRUÇÕES PARA EQUIPE</p><h3>Check-in em 3 passos</h3><div class="schedule-line"><b>01</b><div>Busque o código apresentado pelo visitante.</div></div><div class="schedule-line"><b>02</b><div>Confira o nome na lista demonstrativa.</div></div><div class="schedule-line"><b>03</b><div>Marque a entrada e acompanhe o total.</div></div></section><section class="panel"><p class="eyebrow">EQUIPAMENTO</p><h3>Feito para celular</h3><p>Interface pensada para balcão, portaria ou tablet. Nesta versão, a leitura de QR Code e a sincronização entre aparelhos ainda não estão implementadas.</p></section></aside></div></div>'}
function attendanceRows(filter){filter=String(filter||"").trim().toLowerCase();var filtered=attendees.filter(function(a){return(a.name+" "+a.code).toLowerCase().includes(filter)});return filtered.map(function(a){var checked=!!state.checked[a.code];return '<tr><td>'+safe(a.name)+'</td><td>'+a.code+'</td><td>'+ (checked?chip("Validado"):chip("Pendente","warm")) +'</td><td><button class="btn small '+(checked?"secondary":"")+'" data-action="check" data-id="'+a.code+'">'+(checked?"Desfazer":"Confirmar entrada")+'</button></td></tr>'}).join("")||'<tr><td colspan="4"><div class="empty">Nenhum ingresso fictício encontrado. Experimente VG-1043.</div></td></tr>'}
function manageView(){var n=attendees.filter(function(a){return state.checked[a.code]}).length;return '<div class="container interior">'+pageHead("AMBIENTE 04 / GESTÃO","Controle do evento. <span style='color:var(--lime)'>Em um lugar.</span>","Uma visão prática para quem organiza: acompanhar o credenciamento e atualizar a informação exibida na experiência pública.")+'<div class="topstats"><div class="stat"><b>'+n+'</b><span>Check-ins fictícios</span></div><div class="stat"><b>'+(attendees.length-n)+'</b><span>Inscritos fictícios pendentes</span></div><div class="stat"><b>'+Math.round(n/attendees.length*100)+'%</b><span>Taxa demonstrativa de entrada</span></div></div><div class="two"><div class="stack"><section class="panel"><div class="card-top"><h3>Fluxo de credenciamento</h3>'+chip("Dados de exemplo")+'</div><p>Os totais acompanham as ações feitas na visão Equipe, neste mesmo navegador.</p><div class="progress" role="progressbar" aria-label="Entradas registradas" aria-valuemin="0" aria-valuemax="'+attendees.length+'" aria-valuenow="'+n+'"><div style="width:'+Math.round(n/attendees.length*100)+'%"></div></div><div class="rowline"><span>Entradas registradas</span><b>'+n+'</b></div><div class="rowline"><span>Aguardando</span><b>'+(attendees.length-n)+'</b></div><a class="btn secondary" href="?view=equipe">Abrir credenciamento →</a></section><section class="panel"><p class="eyebrow">COMUNICAÇÃO PÚBLICA</p><h3>Aviso para visitantes</h3><label class="field" for="announcement">Mensagem que aparece na página pública</label><textarea class="input" id="announcement" maxlength="200">'+safe(state.announcement)+'</textarea><p class="help">Exemplo de aviso. Editá-lo não comunica ninguém fora desta demo.</p><button class="btn small" data-action="save-announcement">Atualizar aviso de exemplo</button></section></div><aside class="stack"><section class="panel"><p class="eyebrow">PROGRAMAÇÃO</p><h3>Publicação de agenda</h3><p>Simule quando os horários ilustrativos estariam disponíveis no portal de visitantes.</p><div class="rowline"><b>Horários de exemplo</b>'+(state.programVisible?chip("Publicado"):chip("Oculto","gray"))+'</div><button class="btn secondary" data-action="toggle-program">'+(state.programVisible?"Ocultar programação":"Publicar programação")+'</button><p class="fine">A programação definitiva deve ser confirmada pela organização antes de qualquer implantação.</p></section><section class="panel"><p class="eyebrow">PRÉVIA DO PORTAL</p><h3>Mensagem publicada</h3><div class="notice" style="margin:12px 0"><strong>AVISO</strong><span>'+safe(state.announcement)+'</span></div><a class="btn ghost" href="?view=visitante">Ver página pública →</a></section><section class="panel"><p class="eyebrow">PRÓXIMA ETAPA</p><h3>Para operar de verdade</h3><p>Seriam necessários autenticação por função, banco de dados, sincronização, validação de ingressos e integração acordada com o sistema de bilheteria.</p></section></aside></div></div>'}
var root=document.getElementById("root");
function render(){root.innerHTML=view==="visitante"?publicView():view==="expositor"?expoView():view==="equipe"?teamView():manageView();if(view==="equipe")updateAttendees()}
function updateAttendees(){var el=document.getElementById("attendanceRows");if(el)el.innerHTML=attendanceRows(document.getElementById("searchCode")?.value||"")}
document.addEventListener("input",function(e){if(e.target&&e.target.id==="searchCode")updateAttendees()});
document.addEventListener("change",function(e){if(e.target&&e.target.hasAttribute("data-task")){var idx=Number(e.target.dataset.task);state.tasks[idx]=e.target.checked;persist();render();toast("Checklist atualizado na demonstração.")}});
document.addEventListener("click",function(e){var btn=e.target.closest("[data-action]");if(!btn)return;var action=btn.dataset.action;var id=btn.dataset.id;
if(action==="toggle-save"){state.saved=state.saved.includes(id)?state.saved.filter(function(x){return x!==id}):state.saved.concat(id);persist();render();toast(state.saved.includes(id)?"Atividade adicionada ao roteiro.":"Atividade removida do roteiro.");return}
if(action==="check"){state.checked[id]=!state.checked[id];persist();var txt=document.getElementById("searchCode")?.value||"";render();if(document.getElementById("searchCode")){document.getElementById("searchCode").value=txt;updateAttendees()}toast(state.checked[id]?"Entrada fictícia confirmada.":"Validação fictícia desfeita.");return}
if(action==="save-stand"){var field=document.getElementById("standText");state.standText=field.value.trim().slice(0,180)||initial.standText;persist();render();toast("Perfil demonstrativo atualizado.");return}
if(action==="toggle-stand"){state.standOpen=!state.standOpen;persist();render();toast("Visibilidade do perfil alterada.");return}
if(action==="save-announcement"){var field2=document.getElementById("announcement");state.announcement=field2.value.trim().slice(0,200)||initial.announcement;persist();render();toast("Aviso atualizado na página pública desta demo.");return}
if(action==="toggle-program"){state.programVisible=!state.programVisible;persist();render();toast("Exibição da programação alterada.");return}
if(action==="reset"){if(!confirm("Reiniciar todos os dados de exemplo neste navegador?"))return;try{localStorage.removeItem(key)}catch(ex){}state=JSON.parse(JSON.stringify(initial));render();toast("Demonstração reiniciada.");return}
});
if(view==="visitante"){var origPublic=publicView;publicView=function(){return origPublic().replace('<div class="stripe">','<div class="container"><div class="notice" style="margin:22px 0"><strong>AVISO DA ORGANIZAÇÃO · SIMULAÇÃO</strong><span>'+safe(state.announcement)+'</span></div></div><div class="stripe">')}}
render();
})();
</script>
