function eventCard(e){var on=favorites.indexOf(e.id)!==-1;return '<article class="event-card"><div class="time">'+escapeHtml(e.time)+'</div><div><span class="pill">'+escapeHtml(e.type)+'</span><h3>'+escapeHtml(e.title)+'</h3><p>'+escapeHtml(e.area)+'</p></div><button class="icon-btn '+(on?'saved':'')+'" data-fav="'+e.id+'" aria-label="'+(on?'Remover':'Salvar')+' '+escapeHtml(e.title)+'" title="'+(on?'Remover do roteiro':'Salvar no roteiro')+'">'+(on?'♥':'♡')+'</button></article>'}

s class="btn btn-outline btn-sm" style="margin-top:18px">Limpar roteiro</button>':'')+'</aside></div></div>'}
function expo(){return '<div class="page container">'+title('EXPOSITOR / ARTIST ALLEY','Seu trabalho no centro da cena.','Uma proposta de cadastro de interesse e vitrine para artistas, lojas e estandes — totalmente demonstrativa.')+notice()+'<div class="columns"><section class="panel"><h3>Quero participar como expositor</h3><p class="muted mini">Preencha com informações fictícias para testar o fluxo. Não compartilhe dados pessoais reais aqui.</p><form id="expo-form" class="form-grid"><div class="field"><label for="brand">Nome do estande fictício *</label><input class="input" id="brand" name="brand" required maxlength="50" placeholder="Ex.: Estação Pixel"></div><div class="field"><label for="segment">Categoria *</label><select id="segment" name="segment" class="input" required><option value="">Selecione</option><option>Artist Alley</option><option>Loja geek</option><option>Colecionáveis</option><option>Artesanato</option><option>Alimentação</option></select></div><div class="field full"><label for="description">O que seu estande oferece? *</label><textarea class="input" id="description" name="description" rows="3" required maxlength="170" placeholder="Descreva produtos e experiências fictícias."></textarea><small>Até 170 caracteres; não é enviado a nenhum servidor.</small></div><div class="field full"><button class="btn btn-primary" type="submit">Simular interesse ↗</button></div></form><div id="expo-result" role="status">'+registration+'</div></section><aside class="panel"><span class="eyebrow">A EXPERIÊNCIA IDEAL</span><h3>Mais destaque.<br>Menos mensagens soltas.</h3><div class="steps"><div class="step"><span class="step-num">1</span><div><strong>Inscrição organizada</strong><p>Interesse por tipo de estande em um formulário único.</p></div></div><div class="step"><span class="step-num">2</span><div><strong>Vitrine dos participantes</strong><p>Visitante descobre artistas e marcas com antecedência.</p></div></div><div class="step"><span class="step-num">3</span><div><strong>Acompanhamento da produção</strong><p>Equipe revisa solicitações num painel próprio.</p></div></div></div><div class="line"></div><h3 style="font-size:19px">Stands na simulação</h3><div id="expos-list">'+(expos.length?expos.slice(-4).reverse().map(function(e){return '<div class="listrow"><div><strong>'+escapeHtml(e.brand)+'</strong><small>'+escapeHtml(e.segment)+'</small></div><span class="badge-demo">Demo</span></div>'}).join(''):'<p class="muted mini">Nenhum exemplo enviado neste navegador.</p>')+'</div></aside></div></div>'}
function team(){return '<div class="page container">'+title('EQUIPE / PORTARIA','Entrada leve. Equipe no controle.','Simulação de credenciamento com códigos fictícios para demonstrar conferência, duplicidade e reversão.')+notice()+'<div class="columns"><section class="panel"><span class="eyebrow">VALIDADOR LOCAL</span><h3>Validar credencial de teste</h3><p class="muted mini">Utilize um dos quatro códigos abaixo. Nenhum ingresso oficial é lido ou validado aqui.</p><div class="code-list">'+codes.map(function(c){return '<button data-pick-code="'+c+'">'+c+'</button>'}).join('')+'</div><form id="check-form" style="margin-top:24px" class="switchbox"><label for="ticket-code" style="font-weight:800;font-size:13px">Código da credencial</label><input id="ticket-code" name="ticket" class="input" autocomplete="off" placeholder="AT-0101" maxlength="25" required><button class="btn btn-primary" type="submit">Conferir entrada ↗</button></form><div id="check-result" role="status">'+result+'</div></section><aside class="panel"><div class="eyebrow">CONTROLE DEMONSTRATIVO</div><h3>Resumo da portaria</h3><div class="metrics" style="grid-template-columns:1fr 1fr"><div class="stat"><span>Entradas validadas</span><strong>'+checked.length+'</strong></div><div class="stat"><span>Credenciais de teste</span><strong>04</strong></div></div><p class="muted mini">Os registros são salvos apenas neste navegador, sem integração com a Sympla ou bilheteria.</p><div class="line"></div><h3 style="font-size:19px">Últimas validações</h3><div id="check-list">'+(checked.length?checked.slice().reverse().map(function(c){return '<div class="listrow"><strong>'+escapeHtml(c)+'</strong><span class="kpi-tag">Validado</span></div>'}).join(''):'<div class="empty">Nenhum código validado.</div>')+'</div><button class="btn btn-outline btn-sm" style="margin-top:18px" data-reset-check>Reiniciar teste</button></aside></div></div>'}
function admin(){return '<div class="page container">'+title('ORGANIZAÇÃO / GESTÃO','Tudo em um só lugar.','Uma visão enxuta de programação, estandes e portaria. Números e cadastros são exclusivamente desta simulação.')+notice()+'<div class="metrics"><article class="stat"><span>Atividades na agenda demo</span><strong>'+events.length+'</strong><small class="muted">Editáveis neste navegador</small></article><article class="stat"><span>Credenciais demonstrativas conferidas</span><strong>'+checked.length+' / 4</strong><small class="muted">Atualizadas pela equipe local</small></article><article class="stat"><span>Interesses fictícios de estande</span><strong>'+expos.length+'</strong><small class="muted">Enviados pelo formulário demo</small></article></div><div class="columns"><section class="panel"><div class="section-heading" style="margin-bottom:9px"><div><h3>Programação</h3></div><span class="badge-demo">Edição de demonstração</span></div><div id="admin-events">'+events.slice().sort(function(a,b){return a.time.localeCompare(b.time)}).map(function(e){return '<div class="listrow"><div><strong>'+escapeHtml(e.time)+' · '+escapeHtml(e.title)+'</strong><small>'+escapeHtml(e.area)+' · '+escapeHtml(e.type)+'</small></div><button class="btn btn-outline btn-sm" data-delete-event="'+e.id+'" aria-label="Excluir '+escapeHtml(e.title)+'">Remover</button></div>'}).join('')+'</div><div class="line"></div><h3 style="font-size:18px">Adicionar atração de exemplo</h3><form id="event-form" class="form-grid"><div class="field"><label for="schedule-time">Horário *</label><input id="schedule-time" class="input" name="time" type="time" min="11:00" max="19:00" required value="15:00"></div><div class="field"><label for="schedule-type">Categoria *</label><select id="schedule-type" name="type" class="input" required><option>Palco</option><option>Cosplay</option><option>Games</option><option>Artistas</option></select></div><div class="field full"><label for="schedule-title">Nome da atividade *</label><input id="schedule-title" class="input" name="title" required maxlength="70" placeholder="Ex.: Encontro de artistas"></div><div class="field full"><label for="schedule-area">Local *</label><input id="schedule-area" class="input" name="area" required maxlength="70" placeholder="Ex.: Palco principal"></div><div class="field full"><button type="submit" class="btn btn-light">Publicar na agenda demo ↗</button></div></form><button class="btn btn-outline btn-sm" style="margin-top:17px" data-reset-events>Restaurar programação ilustrativa</button></section><aside class="panel"><h3>Central da edição</h3><p class="muted mini">Uma única operação, três jornadas integradas neste navegador.</p><div class="steps"><div class="step"><span class="step-num">A</span><div><strong>Visitante</strong><p>Visualiza a programação editada e monta seu roteiro.</p></div></div><div class="step"><span class="step-num">B</span><div><strong>Expositores</strong><p>Cadastram interesse e aparecem na lista de triagem.</p></div></div><div class="step"><span class="step-num">C</span><div><strong>Equipe</strong><p>Confere códigos de teste e evita entradas duplicadas.</p></div></div></div><div class="line"></div><h3 style="font-size:20px">Solicitações demonstrativas</h3>'+(expos.length?expos.slice().reverse().map(function(e){return '<div class="listrow"><div><strong>'+escapeHtml(e.brand)+'</strong><small>'+escapeHtml(e.segment)+' · '+escapeHtml(e.description)+'</small></div><span class="badge-demo">Novo</span></div>'}).join(''):'<div class="empty"><strong>Sem solicitações.</strong>Experimente o fluxo de expositores.</div>')+'<a href="/expositores" data-route="/expositores" class="btn btn-outline" style="margin-top:17px;width:100%">Testar inscrição de estande ↗</a></aside></div></div>'}
function render(){route=location.pathname;var content=route==='/programacao'?program():route==='/expositores'?expo():route==='/equipe'?team():route==='/gestao'?admin():home();document.getElementById('root').innerHTML=shell(content);document.title=(route==='/gestao'?'Gestão':route==='/equipe'?'Equipe':route==='/expositores'?'Expositores':route==='/programacao'?'Programação':'Festival')+' · AnimeTech conceito 77'}
function go(p){if(!p)return;history.pushState({},'',p);filter='Todos';search='';render();window.scrollTo(0,0)}
document.addEventListener('click',function(e){var a=e.target.closest('[data-route]');if(a){e.preventDefault();go(a.getAttribute('data-route'));return}var f=e.target.closest('[data-fav]');if(f){var id=Number(f.getAttribute('data-fav'));favorites=favorites.indexOf(id)===-1?favorites.concat([id]):favorites.filter(function(x){return x!==id});store('favorites',favorites);render();toast(favorites.indexOf(id)!==-1?'Salvo no seu roteiro':'Removido do seu roteiro');return}var code=e.target.closest('[data-pick-code]');if(code){document.getElementById('ticket-code').value=code.getAttribute('data-pick-code');document.getElementById('ticket-code').focus();return}if(e.target.closest('[data-clear-favs]')){favorites=[];store('favorites',favorites);render();toast('Roteiro limpo');return}if(e.target.closest('[data-reset-check]')){checked=[];store('checked',checked);result='';render();toast('Validações de teste reiniciadas');return}if(e.target.closest('[data-reset-events]')){events=seed.slice();store('events',events);render();toast('Agenda ilustrativa restaurada');return}var del=e.target.closest('[data-delete-event]');if(del){var id2=Number(del.getAttribute('data-delete-event'));events=events.filter(function(x){return x.id!==id2});favorites=favorites.filter(function(x){return x!==id2});store('events',events);store('favorites',favorites);render();toast('Atividade removida da demo');return}});
document.addEventListener('input',function(e){if(e.target.id==='event-search'){search=e.target.value;var old=e.target.selectionStart;render();var inp=document.getElementById('event-search');if(inp){inp.focus();inp.setSelectionRange(old,old)}}});
document.addEventListener('change',function(e){if(e.target.id==='area-filter'){filter=e.target.value;render()}});
document.addEventListener('submit',function(e){if(e.target.id==='expo-form'){e.preventDefault();var d=new FormData(e.target);var obj={brand:String(d.get('brand')).trim(),segment:String(d.get('segment')),description:String(d.get('description')).trim()};if(!obj.brand||!obj.description)return;expos=expos.concat([obj]).slice(-20);store('expos',expos);registration='<div class="result">Interesse fictício registrado neste navegador. A organização real não recebeu nenhum envio.</div>';render();toast('Exemplo de interesse salvo');return}if(e.target.id==='check-form'){e.preventDefault();var code=String(new FormData(e.target).get('ticket')||'').trim().toUpperCase();if(codes.indexOf(code)===-1){result='<div class="result warn">Código não reconhecido. Use uma credencial fictícia da lista.</div>'}else if(checked.indexOf(code)!==-1){result='<div class="result warn">Esta credencial de teste já foi utilizada. Entrada duplicada impedida.</div>'}else{checked.push(code);store('checked',checked);result='<div class="result">Entrada de demonstração validada: <strong>'+escapeHtml(code)+'</strong>.</div>'}render();return}if(e.target.id==='event-form'){e.preventDefault();var d2=new FormData(e.target);var obj2={id:Date.now(),time:String(d2.get('time')),title:String(d2.get('title')).trim(),area:String(d2.get('area')).trim(),type:String(d2.get('type'))};if(!obj2.title||!obj2.area)return;events.push(obj2);store('events',events);render();toast('Agenda demo atualizada');return}});
window.addEventListener('popstate',render);window.addEventListener('storage',function(e){if(e.key&&e.key.indexOf('atech77_')===0){favorites=read('favorites',[]);checked=read('checked',[]);events=read('events',seed);expos=read('expos',[]);render()}});render();
