function head(r){return '<div class="topnote"><b>Projeto demonstrativo independente</b> · Eventos, locais e ingressos são fictícios · Sem vendas reais</div><header class="header"><div class="shell"><a class="wordmark" href="/" data-link aria-label="Página inicial">APÓS O CREPÚSCULO<span>Um conceito para o Cariri</span></a><button class="menu-toggle" type="button" data-action="menu" aria-expanded="'+mobileOpen+'" aria-label="Abrir ou fechar menu">☰ Menu</button><nav class="nav '+(mobileOpen?"open":"")+'" aria-label="Navegação principal">'+navlink("/","Descobrir",r==="inicio")+navlink("/participante","Participante",r==="participante")+navlink("/equipe","Equipe / entrada",r==="equipe")+navlink("/gestao","Gestão",r==="gestao","nav-accent")+'</nav></div></header>';}
function foot(){return '<footer class="footer"><div class="shell"><div><div class="wordmark" style="font-size:24px">APÓS O CREPÚSCULO</div><p>Proposta visual 77 · Inspirada na cena alternativa do Cariri · Não é um site oficial da La’Sombra.</p><p>Experiência de demonstração local neste navegador. Nada é enviado à organização.</p></div><div><button type="button" data-action="reset">Reiniciar demonstração</button><p style="text-align:right">Cultura, encontros e operação — em um só lugar.</p></div></div></footer>';}
function eventCard(e,i){var people=eventPeople(e.id).length,filled=Math.round(people/e.capacity*100);return '<article class="event-card"><div class="poster '+(e.type==="Cinema"?"cinema":e.type==="Comunidade"?"zine":"")+'"><div class="poster-copy"><div class="poster-label">CARIRI · DEMO CONCEITUAL</div><h3>'+safe(e.poster)+'</h3><p>◈ &nbsp; EXPERIÊNCIA ALTERNATIVA &nbsp; ◈</p></div></div><div class="event-body"><div class="event-meta"><span>'+safe(dateFmt(e.date))+' · '+safe(e.time)+'</span><span>'+safe(e.type)+'</span></div><h3>'+safe(e.name)+'</h3><p>'+safe(e.desc)+'</p><div class="event-foot"><strong>'+(e.open?"INSCRIÇÃO SIMULADA":"INSCRIÇÕES ENCERRADAS")+'</strong><button class="textlink" type="button" data-action="choose-event" data-id="'+safe(e.id)+'">'+(e.open?"Ver experiência ↗":"Ver detalhes ↗")+'</button></div></div></article>';}
function home(){var shown=state.events.filter(function(e){return filter==="Todos"||e.type===filter;});return '<main id="main"><section class="hero"><div class="shell hero-grid"><div class="hero-copy"><div class="eyebrow smallcap">Um universo de música, horror e cultura</div><h1>O lado mais<br><i>vivo</i> do<br>escuro.</h1><p>Um espaço digital imaginado para conectar a comunidade alternativa do Cariri: descobrir encontros, participar e chegar com tudo organizado.</p><div class="actions"><a class="btn primary" href="#agenda">EXPLORAR A AGENDA <span aria-hidden="true">↗</span></a><a class="btn ghost" href="/participante" data-link>VER INSCRIÇÃO DEMO ↗</a></div></div><div class="hero-art" aria-hidden="true"><div class="art-orb"></div><div class="art-arch"></div><div class="art-tower one"></div><div class="art-tower two"></div><div class="art-stars"><span>✧</span><span>✳</span><span>✴</span></div><div class="art-caption">IDENTIDADE VISUAL AUTORAL · NÃO OFICIAL</div></div></div><div class="shell hero-bottom"><span>Uma nova forma de reunir a cena</span><span>JUAZEIRO DO NORTE · CEARÁ · BRASIL</span></div></section><div class="introline"><div class="shell"><span>Feito para quem faz parte da <strong>cena alternativa</strong></span><span>Agenda ↗ &nbsp; Inscrição ↗ &nbsp; Entrada ↗ &nbsp; Gestão ↗</span></div></div><section class="section" id="agenda"><div class="shell"><div class="section-head"><div><div class="eyebrow smallcap">Agenda ilustrativa</div><h2>Próximos rituais.</h2></div><p>Não são eventos anunciados pelo coletivo. Datas e atrações são exemplos para mostrar como a plataforma poderia funcionar.</p></div><div class="filterrow" role="group" aria-label="Filtrar eventos">'+["Todos","Música","Cinema","Comunidade"].map(function(f){return '<button type="button" class="filter '+(filter===f?"active":"")+'" data-action="filter" data-filter="'+f+'" aria-pressed="'+(filter===f)+'">'+f+'</button>';}).join("")+'</div><div class="event-grid">'+(shown.length?shown.map(eventCard).join(""):'<div class="empty">Ainda não há eventos nessa categoria.</div>')+'</div></div></section><div class="rule"></div><section class="section"><div class="shell feature"><div><div class="eyebrow smallcap">Mais do que uma página de divulgação</div><h2>Da descoberta<br>à entrada.</h2><p>Quem participa encontra a programação e recebe uma inscrição ilustrativa. No dia do evento, a equipe localiza o código e confirma a entrada. A gestão acompanha tudo, sem planilhas soltas.</p><div class="feature-steps"><div class="feature-step"><b>01</b><span>Escolher o evento</span></div><div class="feature-step"><b>02</b><span>Gerar código de teste</span></div><div class="feature-step"><b>03</b><span>Confirmar entrada</span></div></div><div class="actions"><a href="/equipe" data-link class="btn ghost">EXPLORAR CREDENCIAMENTO ↗</a></div></div><div class="feature-art"><div class="feature-quote">A sua tribo.<br>O seu <i>lugar.</i></div></div></div></section><div class="cta-band"><div class="shell"><div><div class="smallcap">Um caminho simples, da divulgação à organização</div><h2>Pronto para testar<br>o outro lado?</h2><p>Abra o painel da organização e veja inscrições, lotação e check-ins com dados de exemplo.</p></div><a href="/gestao" data-link class="btn" style="background:#271b23;color:#fff">ACESSAR PAINEL DEMO ↗</a></div></div></main>';}
function pageHead(sub,title,desc){return '<div class="page-head"><div class="shell"><div class="eyebrow smallcap">'+sub+'</div><h1 class="page-title">'+title+'</h1><p>'+desc+'</p></div></div>';}
function ticketUI(p){if(!p)return '<div class="ticket"><div class="smallcap red">Como seria sua confirmação</div><h3>Seu ingresso visual aparecerá aqui.</h3><p class="muted">Escolha um evento e use um apelido fictício. Nenhum dado será enviado e não há ingresso verdadeiro.</p><div class="bar-code" aria-hidden="true" style="opacity:.22"></div><div class="helper">Código único · Consulta pela equipe · Status da entrada</div></div>';var e=eventBy(p.eventId);return '<div class="ticket"><div class="smallcap red">Acesso demonstrativo · Não é ingresso válido</div><h3>'+safe(e?e.name:"Evento de teste")+'</h3><div class="smallcap muted">'+safe(p.name)+'</div><div style="margin-top:20px"><span class="status '+(p.checked?"":"pending")+'">'+(p.checked?"ENTRADA CONFIRMADA · SIMULAÇÃO":"AGUARDANDO ENTRADA · SIMULAÇÃO")+'</span></div><div class="bar-code" aria-hidden="true"></div><div class="smallcap muted">Código para testar com a equipe</div><div class="ticket-code">'+safe(p.id)+'</div><p class="helper" style="margin-top:18px">Apresente este código na área "Equipe / entrada" para simular o check-in.</p></div>';}
function participant(){var pre=new URLSearchParams(location.search).get("evento");var active=eventBy(pre)||state.events.find(function(e){return e.open;})||state.events[0];var last=state.people.find(function(p){return p.id===state.lastTicket;});return '<main id="main">'+pageHead("VISÃO 01 · EXPERIÊNCIA DO PÚBLICO","Uma entrada. Um encontro.","Simule uma inscrição para ver a jornada do participante. Sem compra, sem cadastro e sem dados enviados para fora deste navegador.")+'<section class="page-section"><div class="shell layout-2"><div class="panel"><div class="smallcap red">01 / ESCOLHA E IDENTIFICAÇÃO</div><h2>Reserve seu lugar — no exemplo.</h2><p>Eventos inteiramente ilustrativos. A inscrição aqui não reserva vagas reais.</p><form class="form-grid" id="reg-form"><div class="field"><label for="reg-event">Evento demonstrativo</label><select id="reg-event" required>'+state.events.map(function(e){return '<option value="'+safe(e.id)+'" '+(active&&active.id===e.id?"selected":"")+' '+(!e.open?"disabled":"")+'>'+safe(e.name)+' · '+safe(dateFmt(e.date))+(e.open?"":" · encerrado")+'</option>';}).join("")+'</select></div><div class="field"><label for="reg-name">Apelido fictício para a demonstração</label><input maxlength="45" id="reg-name" placeholder="Ex.: Corvo Noturno" autocomplete="off" required><span class="helper">Não informe seu nome verdadeiro nem outros dados pessoais.</span></div><div class="notice">Esta tela representa uma possível experiência. A venda oficial de ingressos, quando houver, pode continuar pela plataforma que a organização já utiliza.</div><button class="btn primary full" type="submit">GERAR INSCRIÇÃO DE TESTE ↗</button></form><div class="actions"><a href="/" data-link class="textlink">← Voltar para agenda</a></div></div><div><div class="panel" style="padding:18px"><div class="minirow" style="margin:4px 6px 16px"><span class="smallcap">02 / CONFIRMAÇÃO</span><span class="smallcap red">DEMO</span></div>'+ticketUI(last)+'<div class="actions"><a href="/equipe" data-link class="btn ghost full">TESTAR CREDENCIAMENTO ↗</a></div></div></div></div></section></main>';}
function attendeeRows(people){if(!people.length)return '<tr><td colspan="5"><div class="empty">Nenhuma inscrição corresponde ao filtro.</div></td></tr>';return people.map(function(p){var e=eventBy(p.eventId);return '<tr><td><strong>'+safe(p.name)+'</strong><span class="muted">Registro local demo</span></td><td>'+safe(e?e.name:"Removido")+'</td><td class="code">'+safe(p.id)+'</td><td><span class="status '+(p.checked?"":"pending")+'">'+(p.checked?"ENTROU":"PENDENTE")+'</span></td><td><button class="rowbtn" type="button" data-action="toggle-check" data-id="'+safe(p.id)+'">'+(p.checked?"Desfazer":"Confirmar entrada")+'</button></td></tr>';}).join("");}
function team(){var matches=state.people.filter(function(p){var hay=(p.name+" "+p.id+" "+(eventBy(p.eventId)||{}).name).toLowerCase();return hay.includes(search.toLowerCase())&&(checkFilter==="todos"||checkFilter==="entraram"&&p.checked||checkFilter==="pendentes"&&!p.checked);});var total=state.people.length,checked=state.people.filter(function(p){return p.checked;}).length;return '<main id="main">'+pageHead("VISÃO 02 · EQUIPE E PORTARIA","A entrada, sem confusão.","Um fluxo de credenciamento que pode ser operado no celular: procure por código, confirme a entrada e corrija um erro quando necessário.")+'<section class="page-section"><div class="shell"><div class="stat-grid"><div class="stat-box"><span>Inscrições demo</span><strong>'+total+'</strong></div><div class="stat-box"><span>Entradas demo</span><strong>'+checked+'</strong></div><div class="stat-box"><span>Aguardando</span><strong>'+(total-checked)+'</strong></div></div><div class="layout-2" style="margin-bottom:24px"><div class="panel"><div class="smallcap red">AÇÃO RÁPIDA</div><h2>Validar um código.</h2><form id="check-form" class="form-grid"><div class="field"><label for="code-input">Código do participante</label><input id="code-input" placeholder="Ex.: NC-1042" maxlength="20" autocomplete="off" required></div><button class="btn primary" type="submit">CONFIRMAR ENTRADA ↗</button><span class="helper">Teste NC-1042 ou gere seu código na visão Participante.</span></form></div><div class="panel"><div class="smallcap red">FLUXO SIMPLES</div><h2>Como funciona.</h2><p>1. A pessoa apresenta o código demonstrativo.<br>2. A equipe busca ou digita o código.<br>3. O status muda instantaneamente neste navegador.</p><div class="notice">Modo público de treinamento com dados fictícios. Não há controle de acesso real nem sincronização entre dispositivos.</div></div></div><div class="panel"><div class="section-head" style="margin-bottom:22px"><div><div class="smallcap red">LISTA OPERACIONAL</div><h2 style="font-size:37px;margin-top:9px">Inscrições e status</h2></div><p>Consulte, filtre e confirme entradas de teste.</p></div><div class="toolbar"><input aria-label="Pesquisar pelo nome ou código" id="search-people" value="'+safe(search)+'" placeholder="Buscar apelido, evento ou código..."><select id="check-filter" aria-label="Filtrar por situação"><option value="todos" '+(checkFilter==="todos"?"selected":"")+'>Todos</option><option value="pendentes" '+(checkFilter==="pendentes"?"selected":"")+'>Pendentes</option><option value="entraram" '+(checkFilter==="entraram"?"selected":"")+'>Entradas confirmadas</option></select></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Participante</th><th>Evento</th><th>Código</th><th>Estado</th><th>Ação</th></tr></thead><tbody id="attendee-rows">'+attendeeRows(matches)+'</tbody></table></div></div></div></section></main>';}
function manageItem(e){var n=eventPeople(e.id).length,perc=Math.min(100,Math.round(n/e.capacity*100));return '<article class="manage-item"><div class="two"><h3>'+safe(e.name)+'</h3><span class="status '+(e.open?"":"off")+'">'+(e.open?"ABERTO":"ENCERRADO")+'</span></div><p>'+safe(dateFmt(e.date))+' · '+safe(e.time)+' · '+safe(e.type)+'</p><div class="two"><span>'+n+' de '+e.capacity+' vagas de demonstração</span><span>'+perc+'%</span></div><div class="progress" aria-label="'+perc+' por cento de ocupação"><span style="width:'+perc+'%"></span></div><div class="two" style="margin-top:17px"><span>'+countChecked(e.id)+' entradas registradas</span><button class="rowbtn" data-action="toggle-open" data-id="'+safe(e.id)+'" type="button">'+(e.open?"Encerrar inscrições":"Reabrir inscrições")+'</button></div></article>';}
function manager(){var total=state.people.length,checked=state.people.filter(function(p){return p.checked;}).length,capacity=state.events.reduce(function(n,e){return n+e.capacity;},0);return '<main id="main">'+pageHead("VISÃO 03 · ORGANIZAÇÃO","Controle da cena.","Um painel demonstrativo para manter programação, inscrições e credenciamento organizados, com métricas exclusivamente de exemplo.")+'<section class="page-section"><div class="shell"><div class="stat-grid"><div class="stat-box"><span>Inscrições simuladas</span><strong>'+total+'</strong></div><div class="stat-box"><span>Entradas confirmadas</span><strong>'+checked+'</strong></div><div class="stat-box"><span>Eventos na agenda</span><strong>'+state.events.length+'</strong></div></div><div class="layout-2"><div class="panel"><div class="minirow"><div><div class="smallcap red">GESTÃO DE EDIÇÕES</div><h2 style="margin-top:10px">Programação e lotação</h2></div></div><p>Abra ou encerre inscrições fictícias e acompanhe cada edição.</p><div class="manage-list">'+state.events.map(manageItem).join("")+'</div></div><div class="panel"><div class="smallcap red">CRIAR NOVA EDIÇÃO</div><h2>Adicionar um exemplo.</h2><p>Experimente incluir um evento. Ele aparecerá na agenda e na área de inscrições deste navegador.</p><form id="new-event" class="form-grid"><div class="field"><label for="new-name">Nome fictício do evento</label><input id="new-name" required maxlength="55" placeholder="Ex.: Cineclube da Madrugada"></div><div class="cards-2"><div class="field"><label for="new-date">Data</label><input type="date" id="new-date" min="2026-11-05" required value="2027-02-13"></div><div class="field"><label for="new-cap">Capacidade</label><input type="number" id="new-cap" min="1" max="10000" required value="50"></div></div><div class="field"><label for="new-type">Categoria</label><select id="new-type"><option>Música</option><option>Cinema</option><option>Comunidade</option></select></div><button type="submit" class="btn primary">ADICIONAR À AGENDA ↗</button></form><div class="rule" style="margin:28px 0"></div><div class="smallcap red">AJUSTAR CAPACIDADE</div><form id="cap-form" class="form-grid" style="margin-top:15px"><div class="field"><label for="cap-event">Escolher evento</label><select id="cap-event">'+state.events.map(function(e){return '<option value="'+safe(e.id)+'">'+safe(e.name)+'</option>';}).join("")+'</select></div><div class="field"><label for="cap-count">Capacidade máxima</label><input type="number" id="cap-count" min="1" max="10000" value="'+(state.events[0]?state.events[0].capacity:50)+'" required></div><button type="submit" class="btn ghost">SALVAR CAPACIDADE</button></form><div class="notice" style="margin-top:24px">Painel aberto apenas para demonstração. Em uma versão real, a gestão exigiria autenticação, permissões e dados protegidos.</div></div></div></div></section></main>';}
function render(){var r=route();document.title=(r==="inicio"?"Descobrir":r==="participante"?"Participante":r==="equipe"?"Credenciamento":"Gestão")+" — Após o Crepúsculo · Demo";document.getElementById("root").innerHTML=head(r)+(r==="participante"?participant():r==="equipe"?team():r==="gestao"?manager():home())+foot();}
document.addEventListener("click",function(ev){var a=ev.target.closest("a[data-link]");if(a){ev.preventDefault();go(a.getAttribute("href"));return;}var b=ev.target.closest("[data-action]");if(!b)return;var action=b.getAttribute("data-action"),id=b.getAttribute("data-id");if(action==="menu"){mobileOpen=!mobileOpen;render();}else if(action==="filter"){filter=b.getAttribute("data-filter");render();var ag=document.getElementById("agenda");if(ag)ag.scrollIntoView({block:"start"});}else if(action==="choose-event"){go("/participante?evento="+encodeURIComponent(id));}else if(action==="reset"){if(confirm("Restaurar todos os dados fictícios desta demonstração?")){state=getState();state={events:clone(defaults),people:clone(initials),lastTicket:null};filter="Todos";search="";checkFilter="todos";save();render();toast("Demonstração reiniciada.");}}else if(action==="toggle-open"){var e=eventBy(id);if(e){e.open=!e.open;save();render();toast("Inscrições "+(e.open?"abertas":"encerradas")+" no exemplo.");}}else if(action==="toggle-check"){var p=state.people.find(function(x){return x.id===id;});if(p){if(p.checked&&!confirm("Deseja desfazer esta entrada simulada?"))return;p.checked=!p.checked;save();render();toast(p.checked?"Entrada simulada confirmada.":"Check-in de teste desfeito.");}}});
document.addEventListener("submit",function(ev){if(ev.target.id==="reg-form"){ev.preventDefault();var id=document.getElementById("reg-event").value,name=document.getElementById("reg-name").value.trim(),event=eventBy(id);if(!event||!event.open){toast("Inscrições encerradas para este evento demo.");return;}if(name.length<2){toast("Informe um apelido fictício de pelo menos 2 letras.");return;}if(eventPeople(id).length>=event.capacity){toast("A lotação simulada deste evento foi atingida.");return;}var code="NC-"+String(Math.floor(100000+Math.random()*900000));while(state.people.some(function(p){return p.id===code;}))code="NC-"+String(Math.floor(100000+Math.random()*900000));state.people.push({id:code,eventId:id,name:name,checked:false});state.lastTicket=code;save();render();toast("Inscrição de demonstração gerada!");var tc=document.querySelector(".ticket");if(tc)tc.scrollIntoView({block:"nearest",behavior:"smooth"});}else if(ev.target.id==="check-form"){ev.preventDefault();var code=document.getElementById("code-input").value.trim().toUpperCase(),p=state.people.find(function(x){return x.id.toUpperCase()===code;});if(!p){toast("Código não encontrado nos dados de demonstração.");return;}if(p.checked){toast("Este código já teve a entrada simulada confirmada.");return;}p.checked=true;save();render();toast("Entrada de "+p.name+" confirmada no exemplo.");}else if(ev.target.id==="new-event"){ev.preventDefault();var name=document.getElementById("new-name").value.trim(),date=document.getElementById("new-date").value,capacity=Number(document.getElementById("new-cap").value),type=document.getElementById("new-type").value;if(name.length<3||!date||capacity<1||capacity>10000)return;state.events.push({id:"evento-"+Date.now(),name:name,poster:name.toUpperCase(),date:date,time:"19:00",type:type,place:"Cariri · a definir",capacity:capacity,open:true,desc:"Evento fictício criado para testar o painel de organização.",sub:"Criado na demo"});save();render();toast("Evento fictício adicionado à agenda.");}else if(ev.target.id==="cap-form"){ev.preventDefault();var id=document.getElementById("cap-event").value,c=Number(document.getElementById("cap-count").value),e=eventBy(id);if(!e||c<eventPeople(id).length||c>10000){toast("Capacidade inválida ou menor que o total inscrito.");return;}e.capacity=c;save();render();toast("Capacidade de exemplo atualizada.");}});
document.addEventListener("input",function(ev){if(ev.target.id==="search-people"){search=ev.target.value;var matches=state.people.filter(function(p){return(p.name+" "+p.id+" "+(eventBy(p.eventId)||{}).name).toLowerCase().includes(search.toLowerCase())&&(checkFilter==="todos"||checkFilter==="entraram"&&p.checked||checkFilter==="pendentes"&&!p.checked);});var el=document.getElementById("attendee-rows");if(el)el.innerHTML=attendeeRows(matches);}});
document.addEventListener("change",function(ev){if(ev.target.id==="check-filter"){checkFilter=ev.target.value;render();}if(ev.target.id==="cap-event"){var e=eventBy(ev.target.value);if(e)document.getElementById("cap-count").value=e.capacity;}});
window.addEventListener("popstate",render);
render();
})();
</script></body></html>
